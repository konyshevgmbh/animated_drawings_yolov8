# YOLOv8-pose dataset — Amateur Drawings (drawn humanoids, COCO-17 keypoints)
path: ./data

train: images/train
val:   images/val

nc: 1
names: ['drawn_humanoid']

# COCO-17 keypoints
kpt_shape: [17, 3]  # [num_keypoints, dims(x,y,visibility)]

# Keypoint mirror map for horizontal-flip augmentation (left↔right swap)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Skeleton connections for visualization (COCO standard)
skeleton:
  - [16, 14]
  - [14, 12]
  - [17, 15]
  - [15, 13]
  - [12, 13]
  - [6,  12]
  - [7,  13]
  - [6,   7]
  - [6,   8]
  - [7,   9]
  - [8,  10]
  - [9,  11]
  - [2,   3]
  - [1,   2]
  - [1,   3]
  - [2,   4]
  - [3,   5]
  - [4,   6]
  - [5,   7]
